# The Relay's credentials Worker, for anyone who prefers the CLI to pasting
# worker.js into the dashboard (docs/relay-setup.md). From this folder:
#   npx wrangler deploy
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Neither value belongs in this file or anywhere else in the repo.
name = "tavern-turn"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
